spring.application.name=VitaPath
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.datasource.url=jdbc:mysql://localhost:3306/ourSpringProjectDb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
#gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:10000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:90000}
gemini.retry-count=${GEMINI_RETRY_COUNT:1}
app.timezone=${APP_TIMEZONE:Asia/Hebron}
