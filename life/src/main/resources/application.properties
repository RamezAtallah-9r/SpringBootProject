spring.application.name=life


spring.datasource.url=jdbc:mysql://localhost:3306/LifeProject?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA / Hibernate =====
# "update" means Hibernate creates/updates tables automatically from your
# @Entity classes every time you run the app. Good for learning; in a real
# production app you'd use migration scripts instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JSP views =====
# When a controller returns "register", Spring looks for
# /WEB-INF/register.jsp using this prefix+suffix.
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# ===== Gemini AI =====
# Get a free key at https://aistudio.google.com/apikey - click
# "Create API key". With no real key set (still "placeholder"),
# GeminiClient should fall back to a safe/demo response instead of
# crashing - RoadmapEngineService already catches failures and uses
# safeFallbackRoadmap() either way.
# NEVER commit a real key into this file - add application.properties
# to .gitignore, or override with the GEMINI_API_KEY environment
# variable in production (that's what ${GEMINI_API_KEY:placeholder}
# below does automatically).
gemini.api.key=${GEMINI_API_KEY:placeholder}
gemini.model=gemini-2.5-pro

# ===== File uploads (needed for InBody scan uploads) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB