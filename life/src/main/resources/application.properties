spring.application.name=life


spring.datasource.url=jdbc:mysql://localhost:3306/LifeProject?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA / Hibernate =====
# "update" means Hibernate creates/updates tables automatically from your
# @Entity classes every time you run the app. Good for learning; in a real
# production app you'd use migration scripts instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JSP views =====
# When a controller returns "register", Spring looks for
# /WEB-INF/register.jsp using this prefix+suffix.
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

